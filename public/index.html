<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
  <title>파워볼 게임기</title>
  <script>
    (function () {
      if (/(?:^|[?&])dev=1(?:&|$)/.test(location.search)) {
        document.documentElement.classList.add('dev-scroll');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/vendor/powerball/css/chat_owner_pick.css" />
  <link rel="stylesheet" href="assets/css/owner-pick.css" />
  <link rel="stylesheet" href="assets/css/pattern-box.css" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="chat-popup-window cab-1080x1920">
  <script>
    if (document.documentElement.classList.contains('dev-scroll')) {
      document.body.classList.add('dev-scroll');
    }
  </script>
  <div id="toast" class="toast" hidden></div>

  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <h1 data-i18n="loginTitle">로그인</h1>
      <p class="login-sub" data-i18n="loginHint">매장 아이디와 비밀번호를 입력하세요</p>
      <label class="login-lang-label"><span data-i18n="loginLang">언어</span>
        <select id="loginLang" class="login-lang">
          <option value="ko">한국어</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <label><span data-i18n="loginId">아이디</span>
        <input type="text" id="loginUid" autocomplete="username" maxlength="50" />
      </label>
      <label><span data-i18n="loginPwd">비밀번호</span>
        <input type="password" id="loginPwd" autocomplete="current-password" maxlength="50" />
      </label>
      <button type="button" id="loginBtn" data-i18n="loginBtn">로그인</button>
      <p class="login-err" id="loginErr" hidden></p>
    </div>
  </div>

  <div class="cab-root">
    <header class="topbar">
      <div class="date-block">
        <div class="date-led">
          <span id="serverDateDay">——————</span>
          <span id="serverDateTime" class="date-time">--:--</span>
        </div>
      </div>
      <div class="countdown-block">
        <span class="label" data-i18n="countdownLabel">개봉까지</span>
        <div id="countdown" class="seg-clock" aria-live="polite">
          <span class="seg-digit" data-d="-"><b class="a"></b><b class="b"></b><b class="c"></b><b class="d"></b><b class="e"></b><b class="f"></b><b class="g"></b></span>
          <span class="seg-digit" data-d="-"><b class="a"></b><b class="b"></b><b class="c"></b><b class="d"></b><b class="e"></b><b class="f"></b><b class="g"></b></span>
          <span class="seg-colon" aria-hidden="true"><i></i><i></i></span>
          <span class="seg-digit" data-d="-"><b class="a"></b><b class="b"></b><b class="c"></b><b class="d"></b><b class="e"></b><b class="f"></b><b class="g"></b></span>
          <span class="seg-digit" data-d="-"><b class="a"></b><b class="b"></b><b class="c"></b><b class="d"></b><b class="e"></b><b class="f"></b><b class="g"></b></span>
        </div>
      </div>
      <div class="round-block">
        <span class="round"><span data-i18n="roundPrefix">제</span> <em id="roundNo">-</em> <span data-i18n="roundSuffix">회</span></span>
      </div>
    </header>

    <main class="layout-cab">
      <section class="cab-mini">
        <div class="mini-wrap panel">
          <div class="mini-scale">
            <iframe
              id="miniFrame"
              data-i18n-attr="title:miniTitle"
              title="파워볼 애니메이션"
              src="about:blank"
              width="830"
              height="273"
              scrolling="no"
              frameborder="0"
              allowtransparency="true"
            ></iframe>
          </div>
        </div>
      </section>

      <section class="cab-mid">
        <aside class="col-left owner-pick-col">
          <div class="ownerPickStyleRoot chat-popup-owner-head">
            <div class="resultBox">
              <ul class="tab">
                <li><a href="#" onclick="return false;" class="result on" data-i18n="ownerPickTab">개봉기록</a></li>
              </ul>
            </div>
          </div>
          <div class="ownerPickStyleRoot chat-popup-owner-body">
            <div class="resultBox">
              <div class="content">
                <div class="chat-popup-result-scroll">
                  <ul class="resultList" id="resultList"></ul>
                </div>
              </div>
            </div>
          </div>
        </aside>

        <div class="pattern-panel-wrap">
          <table width="100%" border="0" id="patternBox" class="pattern-box">
            <tr>
              <th height="47" class="title" id="patternTitle">
                <span class="pattern-room-ico"><img src="assets/img/pattern/room1.png" alt="" width="40" height="40" /></span>
                <span class="pattern-title-text" id="patternTitleText">제1번방 P/B 패턴 분석</span>
              </th>
            </tr>
            <tr>
              <td class="pattern-body-cell">
                <div class="content" id="patternContent">불러오는 중…</div>
              </td>
            </tr>
          </table>
          <table width="100%" border="0" id="patternBoxUo" class="pattern-box">
            <tr>
              <th height="47" class="title" id="patternTitleUo">
                <span class="pattern-room-ico"><img src="assets/img/pattern/room2.png" alt="" width="40" height="40" /></span>
                <span class="pattern-title-text" id="patternTitleUoText">제2번방 P/B 패턴 분석</span>
              </th>
            </tr>
            <tr>
              <td class="pattern-body-cell">
                <div class="content" id="patternContentUo">불러오는 중…</div>
              </td>
            </tr>
          </table>
          <table width="100%" border="0" id="patternBoxSumOe" class="pattern-box">
            <tr>
              <th height="47" class="title" id="patternTitleSumOe">
                <span class="pattern-room-ico"><img src="assets/img/pattern/room3.png" alt="" width="40" height="40" /></span>
                <span class="pattern-title-text" id="patternTitleSumOeText">제3번방 P/B 패턴 분석</span>
              </th>
            </tr>
            <tr>
              <td class="pattern-body-cell">
                <div class="content" id="patternContentSumOe">불러오는 중…</div>
              </td>
            </tr>
          </table>
          <table width="100%" border="0" id="patternBoxSumUo" class="pattern-box">
            <tr>
              <th height="47" class="title" id="patternTitleSumUo">
                <span class="pattern-room-ico"><img src="assets/img/pattern/room4.png" alt="" width="40" height="40" /></span>
                <span class="pattern-title-text" id="patternTitleSumUoText">제4번방 P/B 패턴 분석</span>
              </th>
            </tr>
            <tr>
              <td class="pattern-body-cell">
                <div class="content" id="patternContentSumUo">불러오는 중…</div>
              </td>
            </tr>
          </table>
        </div>
      </section>

      <section class="cab-bot">
        <section class="panel bet-history">
          <h2 class="bet-history-title" data-i18n="betHistory">배팅 기록</h2>
          <div class="bet-history-scroll">
            <table>
              <colgroup>
                <col class="col-round" />
                <col class="col-mode" />
                <col class="col-amount" />
                <col class="col-payout" />
                <col class="col-result" />
              </colgroup>
              <thead>
                <tr>
                  <th data-i18n="thRound">회차</th>
                  <th data-i18n="thMode">항목</th>
                  <th data-i18n="thAmount">금액</th>
                  <th data-i18n="thPayout">당첨금</th>
                  <th data-i18n="thResult">결과</th>
                </tr>
              </thead>
              <tbody id="betBody"></tbody>
            </table>
          </div>
        </section>

        <aside class="cab-bot-right">
          <div class="cab-deco" aria-hidden="true">
            <img src="assets/img/cab-bot-hud.png" alt="" width="577" height="489" />
          </div>
          <div class="cab-bot-hud" aria-live="polite">
            <!-- 금색 1칸(상단): 배팅종목 아이콘 — 가로 중앙정렬 -->
            <div class="hud-zone hud-zone-mode" id="hudZoneMode">
              <div class="hud-bet-icons" id="modeIcons" hidden></div>
              <div class="hud-text hud-mode-text" id="modeLabel">게임을 선택해주세요</div>
            </div>
            <!-- 금색 하단 칸: 배당률 | 배팅금액 -->
            <div class="hud-zone hud-zone-meta">
              <div class="hud-meta-slot hud-slot-odds">
                <div class="hud-meta-label" data-i18n="hudOdds">배당률</div>
                <div class="hud-text hud-odds-text" id="oddsValue">—</div>
              </div>
              <div class="hud-meta-slot hud-slot-amount">
                <div class="hud-meta-label" data-i18n="hudAmount">배팅금액</div>
                <div class="hud-text hud-amount-text draft-amount-num" id="draftAmount">0u</div>
              </div>
            </div>
            <!-- 블루 3칸: 매장ID | 보유머니 | 포인트 -->
            <div class="hud-blue">
              <div class="hud-text hud-store" id="headerUserName">—</div>
              <div class="hud-text hud-money" id="headerBalance">0u</div>
              <div class="hud-text hud-point" id="headerPoint">
                <span class="hud-point-label">P:</span>
                <span class="hud-point-value" id="headerPointValue">0</span>
              </div>
            </div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/resultList.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
