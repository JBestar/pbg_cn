<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050814" />
  <meta name="format-detection" content="telephone=no" />
  <title>파워볼 모바일</title>
  <link rel="preload" as="image" href="assets/img/login-bg.png" />
  <link rel="stylesheet" href="assets/css/mobile.css?v=2" />
  <link rel="stylesheet" href="assets/css/m-home.css?v=1" />
</head>
<body>
  <div class="m-screen" id="loginShell">

    <section class="m-view" id="viewLogin">
      <header class="m-brand">
        <span class="m-brand-main">POWERBALL</span>
        <span class="m-brand-sub" data-i18n="brandSub">MOBILE</span>
      </header>

      <form class="m-card" id="loginForm" action="#" method="post" novalidate autocomplete="on">
        <div class="m-field">
          <span class="m-field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </span>
          <select id="loginLang" data-i18n-aria="ariaLang" aria-label="언어 선택">
            <option value="ko">한국어</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
          <svg class="m-field-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </div>

        <div class="m-field">
          <span class="m-field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input type="text" id="loginUid" name="username" maxlength="50"
                 autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"
                 data-i18n-ph="phId" data-i18n-aria="ariaId" placeholder="아이디" aria-label="아이디" />
        </div>

        <div class="m-field">
          <span class="m-field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" id="loginPwd" name="password" maxlength="50"
                 autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"
                 data-i18n-ph="phPwd" data-i18n-aria="ariaPwd" placeholder="비밀번호" aria-label="비밀번호" />
          <button type="button" class="m-field-action" id="togglePwd" aria-pressed="false" aria-controls="loginPwd" aria-label="비밀번호 보기">
            <svg class="ico-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="ico-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>

        <button type="submit" class="m-btn-primary" id="loginBtn" data-i18n-aria="ariaLogin" aria-label="로그인">
          <svg class="m-btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          <span class="m-spinner" aria-hidden="true"></span>
          <span data-i18n="btnLogin">로그인</span>
        </button>

        <div class="m-error" id="loginErr" role="alert" aria-live="assertive" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="loginErrText"></span>
        </div>
      </form>
    </section>
  </div>

  <!-- Logged-in app shell (separate from login background) -->
  <div class="m-screen m-screen--app" id="appShell" hidden>
    <div class="m-app-main" id="appMain">

      <section class="m-page" id="pageHome">
        <header class="m-topbar">
          <div class="m-topbar-date">
            <span id="serverDateDay">——————</span>
            <span class="m-topbar-time" id="serverDateTime">--:--</span>
          </div>
          <div class="m-topbar-count">
            <span class="m-count-label" data-i18n="countdownLabel">개봉까지</span>
            <span class="m-count-value" id="countdown">--:--</span>
          </div>
          <div class="m-topbar-round">
            <span data-i18n="roundPrefix">제</span>
            <em id="roundNo">-</em>
            <span data-i18n="roundSuffix">회</span>
          </div>
        </header>

        <div class="m-user-strip">
          <strong id="headerUserName">-</strong>
          <span class="m-chip"><span data-i18n="balance">잔액</span> <span id="headerBalance">0u</span></span>
          <span class="m-chip"><span data-i18n="point">포인트</span> <span id="headerPoint">0</span></span>
        </div>

        <div class="m-mini" id="miniWrap">
          <div class="m-mini-scale" id="miniScale">
            <iframe
              id="miniFrame"
              data-i18n-title="miniTitle"
              title="파워볼 애니메이션"
              src="about:blank"
              width="830"
              height="273"
              scrolling="no"
              frameborder="0"
              allowtransparency="true"
            ></iframe>
          </div>
        </div>

        <div class="m-info">
          <section class="m-panel">
            <div class="m-panel-head" data-i18n="ownerPickTab">개봉기록</div>
            <div class="m-draw-scroll">
              <ul class="m-draw-list" id="mDrawList"></ul>
            </div>
          </section>

          <div class="m-pattern-stack">
            <table class="pattern-box m-pattern-box" id="patternBox">
              <tr>
                <th class="title" id="patternTitle">
                  <span class="pattern-room-ico"><img src="assets/img/pattern/room1.png" alt="" width="34" height="34" /></span>
                  <span class="pattern-title-text" id="patternTitleText">제1번방</span>
                </th>
              </tr>
              <tr>
                <td class="pattern-body-cell">
                  <div class="content" id="patternContent"></div>
                </td>
              </tr>
            </table>

            <table class="pattern-box m-pattern-box" id="patternBoxUo">
              <tr>
                <th class="title" id="patternTitleUo">
                  <span class="pattern-room-ico"><img src="assets/img/pattern/room2.png" alt="" width="34" height="34" /></span>
                  <span class="pattern-title-text" id="patternTitleUoText">제2번방</span>
                </th>
              </tr>
              <tr>
                <td class="pattern-body-cell">
                  <div class="content" id="patternContentUo"></div>
                </td>
              </tr>
            </table>

            <table class="pattern-box m-pattern-box" id="patternBoxSumOe">
              <tr>
                <th class="title" id="patternTitleSumOe">
                  <span class="pattern-room-ico"><img src="assets/img/pattern/room3.png" alt="" width="34" height="34" /></span>
                  <span class="pattern-title-text" id="patternTitleSumOeText">제3번방</span>
                </th>
              </tr>
              <tr>
                <td class="pattern-body-cell">
                  <div class="content" id="patternContentSumOe"></div>
                </td>
              </tr>
            </table>

            <table class="pattern-box m-pattern-box" id="patternBoxSumUo">
              <tr>
                <th class="title" id="patternTitleSumUo">
                  <span class="pattern-room-ico"><img src="assets/img/pattern/room4.png" alt="" width="34" height="34" /></span>
                  <span class="pattern-title-text" id="patternTitleSumUoText">제4번방</span>
                </th>
              </tr>
              <tr>
                <td class="pattern-body-cell">
                  <div class="content" id="patternContentSumUo"></div>
                </td>
              </tr>
            </table>
          </div>
        </div>
      </section>

      <section class="m-page" id="pageBet" hidden>
        <div class="m-placeholder">
          <h2 data-i18n="pageBetTitle">베팅하기</h2>
          <p data-i18n="pageBetSoon">베팅 화면은 준비 중입니다.</p>
        </div>
      </section>

      <section class="m-page" id="pageMgmt" hidden>
        <div class="m-placeholder">
          <h2 data-i18n="pageMgmtTitle">세부관리</h2>
          <p data-i18n="pageMgmtSoon">세부관리 화면은 준비 중입니다.</p>
        </div>
      </section>
    </div>

    <!--
      Bottom Navigation Bar
      Swap icons later via:
        - <img class="m-nav-ico" src="icons/home.svg" alt="">
        - <i class="m-nav-ico fas fa-home"></i>
      Labels come from PBGM_I18N (data-i18n), never from images.
    -->
    <nav class="m-nav" id="mNav" aria-label="Main" hidden>
      <button type="button" class="m-nav-item is-active" data-nav="home" aria-current="page">
        <span class="m-nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/></svg>
        </span>
        <span class="m-nav-label" data-i18n="navHome">홈화면</span>
      </button>
      <button type="button" class="m-nav-item" data-nav="bet" aria-current="false">
        <span class="m-nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8"/><path d="M12 18v4"/><path d="M7 9h2v4H7zM11 8h2v5h-2zM15 10h2v3h-2z"/></svg>
        </span>
        <span class="m-nav-label" data-i18n="navBet">베팅하기</span>
      </button>
      <button type="button" class="m-nav-item" data-nav="mgmt" aria-current="false">
        <span class="m-nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        </span>
        <span class="m-nav-label" data-i18n="navMgmt">세부관리</span>
      </button>
      <button type="button" class="m-nav-item" data-nav="lang" aria-current="false">
        <span class="m-nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </span>
        <span class="m-nav-label" data-i18n="navLang">언어변경</span>
      </button>
      <button type="button" class="m-nav-item" data-nav="logout" aria-current="false">
        <span class="m-nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </span>
        <span class="m-nav-label" data-i18n="navLogout">나가기</span>
      </button>
    </nav>
  </div>

  <div class="m-toast" id="mToast" hidden role="status" aria-live="polite"></div>

  <script src="assets/js/m-i18n.js?v=2"></script>
  <script src="assets/js/m-draws.js?v=1"></script>
  <script src="assets/js/m-nav.js?v=1"></script>
  <script src="assets/js/m-app.js?v=2"></script>
</body>
</html>
